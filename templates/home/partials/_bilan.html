<div class="card" style="margin-bottom:24px; padding:0; overflow:hidden;">
  <div class="bilan-grid">

    <div class="bilan-col">
      <div class="bilan-label">Reçu de SOLIDIS</div>
      <div class="bilan-amount green">{{ pamf_recu_fmt }}</div>
      <div class="bilan-sub">Appels de garantie (Encours × 50 %)</div>
    </div>

    <div class="bilan-col">
      <div class="bilan-label">Payé à SOLIDIS</div>
      <div class="bilan-amount red">{{ pamf_paye_fmt }}</div>
      <div class="bilan-sub">Commissions (1,5 %) + part SOLIDIS sur recouvrement (50 %)</div>
    </div>

    <div class="bilan-col">
      <div class="bilan-label">Solde net PAMF</div>
      <div class="bilan-amount {% if pamf_solde >= 0 %}green{% else %}red{% endif %}">{{ pamf_solde_fmt }}</div>
      <span class="bilan-tag {% if pamf_solde >= 0 %}green{% else %}red{% endif %}">
        {% if pamf_solde >= 0 %}▲ PAMF gagne{% else %}▼ PAMF perd{% endif %}
      </span>
    </div>

  </div>
</div>
