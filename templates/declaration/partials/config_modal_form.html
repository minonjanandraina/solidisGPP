<div class="modal-header">
  <h3>Plafond EMG &amp; seuil de reprise</h3>
  <button class="modal-close" type="button" onclick="closeModal()">&#215;</button>
</div>

<p style="color:#5f6368; font-size:13px; margin-bottom:20px;">
  Au-delà du plafond, l'entrée en portefeuille (F2) est suspendue. Elle reprend une fois l'encours
  redescendu au (ou sous le) seuil de reprise.
</p>

<form hx-post="{% url 'declaration:update_config' %}"
      hx-target="#declaration-config-panel"
      hx-swap="outerHTML">
  {% csrf_token %}

  <div class="modal-field">
    <label>Plafond EMG (Ar)</label>
    <input type="number" step="0.01" name="plafond_emg" value="{{ plafond_emg_raw }}" required>
  </div>

  <div class="modal-field">
    <label>Seuil de reprise (% du plafond)</label>
    <input type="number" step="0.01" min="0" max="100" name="seuil_reprise_pct" value="{{ seuil_reprise_pct_raw }}" required>
  </div>

  <div class="modal-actions">
    <button type="button" class="btn btn-outline" onclick="closeModal()">Annuler</button>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
  </div>
</form>
